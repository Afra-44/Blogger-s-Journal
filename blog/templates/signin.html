{% extends "blog.html" %}

{% block title %}
    SignIn
{% endblock %}

{% block main %}

    <!--img div-->
            <div class="d-flex align-items-start flex-column  ">
                <img class="simg img-1 rounded-5 z-2 " src="https://images.unsplash.com/photo-1488190211105-8b0e65b80b4e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8dHJhdmVsJTIwYmxvZ3xlbnwwfHwwfHx8MA%3D%3D" alt="">
                <img class="simg img-2 rounded-5 z-1" src="https://media.istockphoto.com/id/947989088/photo/attractive-woman-vlogging-from-vienna.webp?a=1&b=1&s=612x612&w=0&k=20&c=qsoyVtSdmvR7VMh3aZeaIT-Q8YyAnDFEcuDf-OLWOzA=" alt="">
                <img class="img-3 simg rounded-5 z-3" src="https://media.istockphoto.com/id/1249204817/photo/woman-photographing-fresh-green-soup.webp?a=1&b=1&s=612x612&w=0&k=20&c=7BThwk2hT74q9zhyrIL2dt1TwfNfdWaTTvt_3VUvkAM=" alt="">
            </div>  
    <!--login div-->
    <div class="login m-0 d-flex flex-column mx-auto text-center justify-content-md-center">
                <nav class="nav m-0 flex-column bg-secondary bg-gradient bg-opacity-25  end-0 p-4 ">
                <h5 class="m-3 lh-base p-2">Make your own blog with us at<br>
                     <span class="fst-italic fw-bold fs-2 text-body-emphasis">Blogger's journal</span></h5>
                <!--sign in form-->
                <div class="m-4"><form action="/" method="post">
                    <h4>Sign in</h4>    
                    <input class="px-5 p-1 m-3 text-dark" type="text" name="name" required placeholder="User-name"><br>
                    <input class="px-5 p-1 m-3 text-dark" type="password" name="password" required placeholder="Password"> <br>
                    <button type="submit" class="text-dark bg-success px-4 m-3 rounded-5">Sign in</button></div>
                </form>
               <a class="m-1" href="/check">Forgot password?</a>
                <!--or sign up-->
                <div class="m-1 text-dark-emphasis">
                    <h5 class="m-3"><small> Don't have an account? <br>
                    Create a new one!</small>
                    <a class="text-decoration-none" href="/signup">Sign up</a></h5>
                </div></nav>
            </div>
{% endblock %}
